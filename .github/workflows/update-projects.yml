name: Update projects tables

# Refreshes project details and badge visibility once an hour.
# Run scripts/maintaining-projects.py by hand to see the same result locally.
on:
  schedule:
    - cron: '0 * * * *' # hourly, on the hour
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: update-projects
  cancel-in-progress: false

env:
  BADGERS_CLI_VERSION: 0.2.2

jobs:
  update:
    name: Refresh the tables
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Building badgers-cli takes over a minute, so keep the binary between runs.
      - name: Restore badgers-cli
        id: badgers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/badgers-cli
          key: badgers-cli-${{ env.BADGERS_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - if: steps.badgers.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install badgers-cli
        if: steps.badgers.outputs.cache-hit != 'true'
        run: cargo install badgers-cli --locked --version "$BADGERS_CLI_VERSION"

      - name: Put badgers-cli on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Regenerate the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintaining-projects.py

      - name: Commit if it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md badges
          if git diff --staged --quiet; then
            echo "the tables are already current"
            exit 0
          fi
          git commit -m "chore: refresh the maintaining-projects tables"
          git push
