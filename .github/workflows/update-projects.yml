name: Update projects tables

# Refreshes project details and badge visibility once an hour.
# Run scripts/maintaining-projects.py by hand to see the same result locally.
on:
  schedule:
    - cron: '0 * * * *' # hourly, on the hour
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the tables
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Regenerate the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintaining-projects.py

      - name: Commit if it changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "the tables are already current"
            exit 0
          fi
          git commit -m "chore: refresh the maintaining-projects tables"
          git push
